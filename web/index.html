<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSocks 控制面板</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>HomeSocks</h2>
            <p>请输入面板口令以继续</p>
            <input type="password" id="pwd-input" placeholder="Password">
            <button onclick="login()">登 录</button>
        </div>
    </div>

    <div id="app" style="display: none;">
        <header>
            <h1>HomeSocks Dashboard</h1>
            <div class="controls">
                <button id="btn-master" onclick="doAction('toggle_master')">总开关: -</button>
                <button id="btn-route" onclick="doAction('toggle_routing')">模式: -</button>
            </div>
        </header>

        <main>
            <section class="card status-card">
                <h3>当前出口状态</h3>
                <div class="info-grid">
                    <div><span>SOCKS5 端口:</span> <b id="ui-port">-</b></div>
                    <div><span>真连接延迟:</span> <b id="ui-delay" class="delay">- ms</b></div>
                    <div><span>当前节点 IP:</span> <b id="ui-ip">-</b></div>
                    <div><span>选路策略:</span> <b id="ui-mode">-</b></div>
                </div>
            </section>

            <section class="card priority-card">
                <div class="card-header" style="border:none; padding-bottom: 0;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 14px; color: #aaa;">自动寻优国家优先级 (如 JP, KR, US):</span>
                        <input type="text" id="priority-input" placeholder="JP, KR" style="margin:0; width:150px; padding: 6px;">
                        <button onclick="updatePriority()" style="padding: 6px 12px;">保存</button>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h3>家宽候选节点</h3>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="country-filter" onchange="renderNodes()">
                            <option value="ALL">全部国家</option>
                        </select>
                        <button class="btn-auto" onclick="doAction('set_auto')">开启自动寻优</button>
                    </div>
                </div>
                <div id="node-list" class="node-list">
                    <p>加载中...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

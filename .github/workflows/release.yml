name: Build and Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          go build -ldflags="-s -w" -o build/homesocks-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/homesocks

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/homesocks-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}